name: Lint
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
        version: 11
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm lint
